[project]
name = "streamlit-canary"
version = "0.4.0a11"
description = "LK-flavored Streamlit components."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
license = "MIT"
# readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argsense>=1.1.2",
    "lk-utils>=3.8.2a16",
    "neoprint>=0.1.11",
    "psutil>=7.0.0",
    "pyapp-window>=2.2.3",
    "streamlit>=1.61.0,!=1.62.*",
    #   note:
    #   v1.62 has a bug with `st.popover:width`.
    #   v1.63 cannot render dual-line ("\n\n") button (i.e. the "thick" button).
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.29.0"]

[dependency-groups]
dev = [
    "argsense>=1.1.3a1,<1.2.0",
    "asa-gui>=2026.9.10b0; python_version >= '3.12'",
    "requests>=2.34.2",
    "starlette>=1.6.0",
    "streamlit-extras>=1.6.0",
    "uvicorn[standard]>=0.52.4",
]

# [project.optional-dependencies]
# ...

# [project.scripts]
# ...

[project.urls]
homepage = "https://github.com/likianta/streamlit-canary"

[tool.hatch.build.targets.wheel]
packages = ["streamlit_canary"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

# [tool.ruff.lint]
# extend-select = ["I001", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

# [tool.ty.environment]
# extra-paths = ["./lib"]

[tool.ty.rules]
call-non-callable = "ignore"
invalid-type-form = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2131/"
# explicit = true

[tool.uv.sources]
airmise = { index = "likianta" }
argsense = { index = "likianta" }
asa-gui = { index = "likianta" }
lk-utils = { index = "likianta" }
neoprint = { index = "likianta" }
pyapp-window = { index = "likianta" }
